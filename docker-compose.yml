services:
  db:
    container_name: bookings-db
    image: postgres:17
    environment:
      POSTGRES_USER: bookings_user
      POSTGRES_PASSWORD: bookings_password
      POSTGRES_DB: bookings_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings_user -d bookings_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
